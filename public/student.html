<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal</title><link rel="stylesheet" href="style.css"></head><body><header><b>HMS — Student Portal</b><a href="index.html">Logout</a></header><div id="login" class="login"><h1>Student Login</h1><input id="sid" placeholder="Student ID"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg" class="error"></p></div><main id="app" class="container hidden"><h1>Welcome, <span id="name"></span> 👋</h1><section><h2>👤 My Details</h2><div class="details" id="details"></div></section><section><h2>🏠 Room Details</h2><div class="room" id="room"></div></section><section><h2>💰 Fee Details</h2><div class="table"><table><thead><tr><th>Amount</th><th>Due Date</th><th>Status</th></tr></thead><tbody id="fees"></tbody></table></div></section><section><h2>📅 Attendance</h2><div class="attendance-summary" id="attendanceSummary"></div><div class="table"><table><thead><tr><th>Date</th><th>Status</th><th>Remarks</th></tr></thead><tbody id="attendance"></tbody></table></div></section><section><h2>📝 Complaints</h2><input id="subject" placeholder="Complaint subject"><textarea id="description" placeholder="Describe your complaint"></textarea><button onclick="complain()">Submit Complaint</button><div class="table"><table><thead><tr><th>Subject</th><th>Description</th><th>Date</th><th>Status</th></tr></thead><tbody id="complaints"></tbody></table></div></section><section><h2>🍽️ Mess Details</h2><div class="table"><table><thead><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead><tbody id="mess"></tbody></table></div></section></main><script>let st;const $=x=>document.getElementById(x);async function api(u,o){let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d}async function login(){try{st=await api('/api/student/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:$('sid').value,password:$('pw').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');render();load()}catch(e){$('msg').textContent=e.message}}function render(){$('name').textContent=st.name;$('details').innerHTML=Object.entries({"Student ID":st.student_id,Name:st.name,Email:st.email,Phone:st.phone,Course:st.course,Year:st.year,Address:st.address}).map(x=>`<div><b>${x[0]}</b><span>${x[1]||'-'}</span></div>`).join('');$('room').innerHTML=`<div><b>Room Number</b><strong>${st.room_number||'Not allocated'}</strong></div><div><b>Status</b><strong class="green">Allocated</strong></div>`}async function load(){let[f,c,m,a]=await Promise.all([api('/api/fees/'+st.student_id),api('/api/complaints/'+st.student_id),api('/api/mess'),api('/api/attendance/'+st.student_id)]);$('fees').innerHTML=f.map(x=>`<tr><td>₹${x.amount}</td><td>${x.due_date}</td><td>${x.status}</td></tr>`).join('');$('complaints').innerHTML=c.map(x=>`<tr><td>${x.subject}</td><td>${x.description}</td><td>${x.date}</td><td>${x.status}</td></tr>`).join('');const present=a.filter(x=>x.status==='Present').length, late=a.filter(x=>x.status==='Late').length, absent=a.filter(x=>x.status==='Absent').length, leave=a.filter(x=>x.status==='Leave').length, total=a.length, percentage=total?((present/total)*100).toFixed(1):'0.0';$('attendanceSummary').innerHTML=`<div><b>Attendance</b><strong>${percentage}%</strong></div><div><b>Present</b><strong>${present}</strong></div><div><b>Absent</b><strong>${absent}</strong></div><div><b>Late</b><strong>${late}</strong></div><div><b>Leave</b><strong>${leave}</strong></div>`;$('attendance').innerHTML=a.map(x=>`<tr><td>${x.date}</td><td>${x.status}</td><td>${x.remarks||'-'}</td></tr>`).join('');$('mess').innerHTML=m.map(x=>`<tr><td>${x.day}</td><td>${x.breakfast}</td><td>${x.lunch}</td><td>${x.dinner}</td></tr>`).join('')}async function complain(){if(!$('subject').value||!$('description').value)return alert('Fill both fields');try{alert((await api('/api/complaints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:st.student_id,subject:$('subject').value,description:$('description').value})})).message);$('subject').value='';$('description').value='';load()}catch(e){alert(e.message)}}</script></body></html>
